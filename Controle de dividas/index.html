<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto de Dívidas </title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Gerenciador de Dívidas</h1>
      <p>Controle de dividas para não ficar com o nome sujo no Serasa </p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Caixa</h2>
      <form id="createDebtForm">
        <label>Valor a guardar</label>
        <input id="debtValue" type="number" min="0.01" step="0.01" placeholder="Ex: 1200,00" required />

        <label>Produto/Serviço</label>
        <input id="debtProduct" type="text" placeholder="Ex: Curso Java" required />

        <label>Número de parcelas</label>
        <input id="debtParcelas" type="number" min="1" step="1" placeholder="Ex: 12" required />

        <button type="submit">Salvar saída</button>
      </form>
    </section>

    <section class="card">
      <h2>Dividas</h2>
    
      <form id="payDebtForm">
        <label>Selecionar dívida</label>
        <select id="debtSelect"></select>

        <label>Parcelas restantes</label>
        <input id="remainingInstallments" type="text" value="-" readonly />

        <label>Quantas parcelas pagar?</label>
        <input id="payInstallments" type="number" min="1" step="1" placeholder="Digite o número de parcelas" />

        <button type="submit">Pagar parcelas</button>
      </form>
      <div class="debt-status"><strong>Status:</strong> <span id="debtStatus">Selecione uma dívida</span></div>
    </section>

    <section class="card">
      <h2>Entradas</h2>
      <form id="incomeForm">
        <label>Valor recebido</label>
        <input id="incomeValue" type="number" min="0.01" step="0.01" placeholder="Ex: 500,00" required />

        <label>Descrição</label>
        <input id="incomeDesc" type="text" placeholder="Ex: Pagamento recebido" required />

        <button type="submit">Registrar entrada</button>
      </form>
    </section>

    <section class="card card-accent">
      <h2>Controle de dados</h2>
      <div id="debtList" class="data-block">Carregando dívidas...</div>
      <div id="entryList" class="data-block">Carregando entradas...</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script>
    let debts = [];
    let entries = [];
    let debtCounter = 0;

    const createDebtForm = document.getElementById('createDebtForm');
    const payDebtForm = document.getElementById('payDebtForm');
    const incomeForm = document.getElementById('incomeForm');
    const debtSelect = document.getElementById('debtSelect');
    const remainingInstallments = document.getElementById('remainingInstallments');
    const debtStatus = document.getElementById('debtStatus');
    const debtList = document.getElementById('debtList');
    const entryList = document.getElementById('entryList');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateDebtSelect() {
      debtSelect.innerHTML = '<option value="">Selecione uma dívida</option>';
      debts.forEach((debt, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${debt.product} - ${debt.remaining} parcelas restantes`;
        debtSelect.appendChild(option);
      });
    }

    function updateDisplays() {
      debtList.innerHTML = debts.length ? debts.map((debt, index) => 
        `<div>Dívida ${index + 1}: ${debt.product}, Parcelas: ${debt.parcels}, Restantes: ${debt.remaining}, Valor: R$ ${debt.value}</div>`
      ).join('') : 'Nenhuma dívida cadastrada.';
      
      entryList.innerHTML = entries.length ? entries.map(entry => 
        `<div>Entrada: ${entry.desc}, Valor: R$ ${entry.value}</div>`
      ).join('') : 'Nenhuma entrada registrada.';
    }

    createDebtForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = parseFloat(document.getElementById('debtValue').value);
      const product = document.getElementById('debtProduct').value.trim();
      const parcels = parseInt(document.getElementById('debtParcelas').value);

      if (value <= 0 || !product || parcels <= 0 || parcels > 24) {
        showToast('Dados inválidos. Verifique os valores.');
        return;
      }

      debts.push({ product, parcels, remaining: parcels, value });
      updateDebtSelect();
      updateDisplays();
      createDebtForm.reset();
      showToast('Dívida cadastrada com sucesso!');
    });

    debtSelect.addEventListener('change', () => {
      const index = debtSelect.value;
      if (index === '') {
        remainingInstallments.value = '-';
        debtStatus.textContent = 'Selecione uma dívida';
        return;
      }
      const debt = debts[index];
      remainingInstallments.value = debt.remaining;
      debtStatus.textContent = debt.remaining === 0 ? 'Pago' : 'Pendente';
    });

    payDebtForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const index = debtSelect.value;
      const pay = parseInt(document.getElementById('payInstallments').value);

      if (index === '' || pay <= 0) {
        showToast('Selecione uma dívida e digite um número válido de parcelas.');
        return;
      }

      const debt = debts[index];
      if (pay > debt.remaining) {
        showToast('Número de parcelas a pagar maior que o restante.');
        return;
      }

      debt.remaining -= pay;
      updateDebtSelect();
      updateDisplays();
      debtSelect.dispatchEvent(new Event('change'));
      payDebtForm.reset();
      showToast(`Pagou ${pay} parcelas. Restantes: ${debt.remaining}`);
    });

    incomeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = parseFloat(document.getElementById('incomeValue').value);
      const desc = document.getElementById('incomeDesc').value.trim();

      if (value <= 0 || !desc) {
        showToast('Dados inválidos.');
        return;
      }

      entries.push({ value, desc });
      updateDisplays();
      incomeForm.reset();
      showToast('Entrada registrada com sucesso!');
    });

    updateDisplays();
  </script>
</body>
</html>
