<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caixa - Controle de Dívidas</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <link rel="stylesheet" href="../../assets/app/caixa.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Caixa</h1>
      <p>Visualize o saldo do caixa e registre movimentações financeiras.</p>
      <button type="button" onclick="window.location.href='index.html'">Voltar ao Início</button>
    </div>
  </header>
  <main class="container">
    <section class="card">
        <h2>Saldo atual</h2>
        <p>Aqui você pode controlar o dinheiro disponível no caixa, entradas e saídas.</p>
        <div class="data-block">
        <p><strong>Saldo atual:</strong> R\$ 0,00</p>
        <p><strong>Total de entradas:</strong> R\$ 0,00</p>
        <p><strong>Total de saídas:</strong> R\$ 0,00</p>
      </div>
    </section>
    <section class="card">
      <h2>Movimentação do Caixa</h2>
      <form>
        <label>Valor</label>
        <input type="number" min="0.01" step="0.01" placeholder="Ex: 250,00" />

        <label>Tipo</label>
        <select>
          <option value="">Selecione</option>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <label>Descrição</label>
        <input type="text" placeholder="Ex: Venda de produto" />

        <button type="button">Registrar movimentação</button>
      </form>
    </section>
  </main>
</body>
</html>
