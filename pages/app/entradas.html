<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entradas - Controle de Dívidas</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <link rel="stylesheet" href="../../assets/app/entradas.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Entradas</h1>
      <p>Cadastro e visualização das entradas financeiras.</p>
      <button type="button" onclick="window.location.href='index.html'">Voltar ao Início</button>
    </div>
  </header>
  <main class="container">
    <section class="card">
      <h2>Registrar nova entrada</h2>
      <form>
        <label>Valor recebido</label>
        <input type="number" min="0.01" step="0.01" placeholder="Ex: 500,00" />

        <label>Descrição</label>
        <input type="text" placeholder="Ex: Pagamento de cliente" />

        <button type="button">Salvar entrada</button>
      </form>
    </section>
    <section class="card">
      <h2>Histórico de entradas</h2>
      <div class="data-block">
        <p>Nenhuma entrada cadastrada ainda.</p>
      </div>
    </section>
  </main>
</body>
</html>
