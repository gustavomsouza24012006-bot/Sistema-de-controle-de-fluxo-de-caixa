<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contas a receber - Controle de Dívidas</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <link rel="stylesheet" href="../../assets/app/registrar-entrada.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Contas a receber</h1>
      <p>Adicione valores recebidos ao sistema de forma rápida e segura.</p>
      <button type="button" onclick="window.location.href='../../index.html'">Voltar ao Início</button>
    </div>
  </header>
  <main class="container">
    <section class="card">
      <h2>Nova entrada</h2>
      <form>
        <label>Valor recebido</label>
        <input type="number" min="0.01" step="0.01" placeholder="Ex: 350,00" />

        <label>Descrição</label>
        <input type="text" placeholder="Ex: Venda de serviço" />

        <label>Data</label>
        <input type="date" />

        <button type="button">Contas a receber</button>
      </form>
    </section>
  </main>
</body>
</html>
