<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Controle de Dívidas</title>
  <link rel="stylesheet" href="../../assets/styles.css" />
  <link rel="stylesheet" href="../../assets/auth/cadastro.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Criar Conta</h1>
      <p>Cadastre-se para acessar o sistema de controle de dívidas</p>
    </div>
  </header>

  <main class="container">
    <div class="form-wrapper">
      <section class="card">
        <h2>Novo Cadastro</h2>
        <p>Preencha os dados abaixo para criar sua conta</p>

        <form id="cadastroForm" class="cadastro-form">
          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required maxlength="100" />
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required />
            <small class="form-hint">Confirme um e-mail válido para seu cadastro</small>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required minlength="8" />
            <small class="form-hint">Use uma senha forte com letras e números</small>
          </div>

          <div class="form-group">
            <label for="confirmarSenha">Confirmar Senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita sua senha" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Criar Conta</button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
          </div>
        </form>

        <div class="form-footer">
          <p>Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
          <p><a href="../app/index.html" class="btn-text">← Voltar ao início</a></p>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="../../src/Cadastro.java"></script>
</body>
</html>
